project:
  type: website
  resources:
    - assets/
  output-dir: docs   # GitHub Pages can serve directly from /docs

website:
  search: false
  title: "Veronika S. Corradi-Eiger"
  site-url: "https://nikacorradi.github.io"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: photography.qmd
        text: Places
    right:
      - text: '<i class="ai ai-orcid"></i>'
        href: "https://orcid.org/0009-0009-1218-7961"
        aria-label: ORCID
      - icon: linkedin
        href: "https://www.linkedin.com/in/nikacorradi/"
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Veronika S. Corradi-Eiger"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: litera
      dark: darkly
    css:
      - assets/academicons/css/academicons.min.css
      - styles.css
    toc: false
    page-layout: full
    mainfont: "Source Serif 4, Georgia, serif"
